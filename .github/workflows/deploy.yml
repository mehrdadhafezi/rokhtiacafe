name: deploy-tests

# Deployment hardening tests (T14): templates, release checksums, backup, retention and restore
# against throwaway PostgreSQL containers only. Never connects to any server; never deploys.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-tests:
    name: deploy scripts (disposable PostgreSQL 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Template integrity (shellcheck, systemd-analyze, compose config)
        run: bash deploy/test/templates.sh

      - name: Release build
        run: scripts/build-release.sh "ci-${GITHUB_SHA::12}"

      - name: Suite with host client tools (fresh cluster in a throwaway container)
        run: bash deploy/test/in-docker.sh release

      - name: Suite with the production compose file (docker client, disposable copy)
        run: bash deploy/test/compose.sh release
