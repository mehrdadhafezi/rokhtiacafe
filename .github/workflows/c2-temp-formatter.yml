name: C2 temporary Go formatter
on:
  push:
    branches:
      - feature/customer-accounts-history-reporting
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format only new C2 files
        run: |
          gofmt -w backend/internal/customer/customer.go backend/internal/api/customer_auth_test.go
          git diff --check
          if ! git diff --quiet -- backend/internal/customer/customer.go backend/internal/api/customer_auth_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- backend/internal/customer/customer.go backend/internal/api/customer_auth_test.go
            git commit -m 'style(C2): gofmt customer authentication and tests'
            git push origin HEAD:feature/customer-accounts-history-reporting
          fi
