name: frontend

# CI only: typecheck, lint, test, build, PWA separation check. Never deploys.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Staff-only PWA check (R-F12-1)
        run: |
          npm run check:pwa
          # Belt and braces, independent of the script above.
          if grep -qi 'rel="manifest"' dist/index.html; then echo "customer index.html links a manifest"; exit 1; fi
          grep -qi 'rel="manifest"' dist/admin/index.html || { echo "admin index.html has no manifest link"; exit 1; }
