# Local development database only. Bound to 127.0.0.1; never used in production.
# Passwords below are development-only defaults; override them in your local .env.
name: rokhtiacafe

services:
  postgres:
    # Target is 17; set POSTGRES_IMAGE=postgres:16-alpine in .env if 17 cannot be pulled (16 is the supported minimum).
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DEV_SUPERUSER_PASSWORD:-postgres_dev_only}
      ROKH_DB_NAME: rokhtiacafe
      ROKH_OWNER_PASSWORD: ${ROKH_OWNER_DEV_PASSWORD:-owner_dev_only}
      ROKH_APP_PASSWORD: ${ROKH_APP_DEV_PASSWORD:-app_dev_only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres/10-rokh-init.sh:/docker-entrypoint-initdb.d/10-rokh-init.sh:ro
      - ./deploy/local/postgres/roles.sql:/rokh/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rokhtiacafe"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
